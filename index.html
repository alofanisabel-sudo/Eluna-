<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Eluna</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="app">

  <header class="app-header">
    <div class="header-inner">
      <h1 class="brand">Eluna</h1>
      <p class="tagline">ton espace de réflexion</p>
    </div>
  </header>

  <main class="chat" id="chat">
    <div class="msg msg-eluna">
      <div class="bubble">
        Je suis là. À quoi tu penses aujourd'hui ?
      </div>
    </div>
  </main>

  <footer class="composer">
    <form id="composer-form" class="composer-form">
      <textarea
        id="input"
        class="input"
        placeholder="Écris à Eluna..."
        rows="1"
        autocomplete="off"
      ></textarea>
      <button type="submit" class="send-btn" aria-label="Envoyer">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M4 12L20 4L14 20L11 13L4 12Z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round"/>
        </svg>
      </button>
    </form>
  </footer>

</div>

<script src="script.js"></script>
</body>
</html>
