<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Eluna</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#14162B">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="app">

  <header class="app-header">
    <div class="header-inner">
      <h1 class="brand">Eluna</h1>
      <p class="tagline">ton espace de réflexion</p>
    </div>

    <div class="project-bar">
      <select id="project-select" class="project-select"></select>
      <button type="button" id="add-project-btn" class="add-project-btn" aria-label="Nouveau projet">+</button>
    </div>

    <div id="new-project-row" class="new-project-row hidden">
      <input type="text" id="new-project-input" class="new-project-input" placeholder="Nom du projet...">
      <button type="button" id="confirm-project-btn" class="confirm-project-btn">Créer</button>
    </div>
  </header>

  <main class="chat" id="chat"></main>

  <footer class="composer">
    <form id="composer-form" class="composer-form">
      <button type="button" id="mic-btn" class="mic-btn" aria-label="Parler">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M12 15a3 3 0 003-3V6a3 3 0 10-6 0v6a3 3 0 003 3z" stroke="currentColor" stroke-width="1.6"/>
          <path d="M19 11a7 7 0 01-14 0M12 18v3" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
        </svg>
      </button>
      <textarea
        id="input"
        class="input"
        placeholder="Écris à Eluna..."
        rows="1"
        autocomplete="off"
      ></textarea>
      <button type="submit" class="send-btn" aria-label="Envoyer">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M4 12L20 4L14 20L11 13L4 12Z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round"/>
        </svg>
      </button>
    </form>
  </footer>

</div>

<script type="module" src="script.js"></script>
</body>
</html>
